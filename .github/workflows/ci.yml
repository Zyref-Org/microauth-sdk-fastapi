name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      # Runs the Lua scripts against a real Redis instead of skipping them.
      MICROAUTH_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -e ".[dev,redis,mcp]"

      - name: Run tests
        run: python -m pytest

      - name: Lint and type-check
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy microauth_fastapi
          python -m pip_audit

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
