[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microauth-fastapi"
version = "2.8.0"
description = "MicroAuth SDK for FastAPI - API key auth, rate limiting and metered billing in one dependency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zyref, LLC" }]
keywords = ["fastapi", "api-keys", "authentication", "billing", "rate-limiting", "microauth"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["build", "mypy", "pip-audit", "pytest", "ruff"]

[project.urls]
Homepage = "https://microauth.com"
Repository = "https://github.com/Zyref-Org/microauth-sdk-fastapi"

[tool.hatch.build.targets.wheel]
packages = ["microauth_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"microauth_fastapi/limiter.py" = ["BLE001"]
"microauth_fastapi/sdk.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
packages = ["microauth_fastapi"]
check_untyped_defs = true
warn_unused_ignores = true
