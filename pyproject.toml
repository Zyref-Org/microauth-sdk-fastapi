[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microauth-fastapi"
version = "0.1.0"
description = "MicroAuth SDK for FastAPI - API key auth, rate limiting and metered billing in one dependency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zyref, LLC" }]
keywords = ["fastapi", "api-keys", "authentication", "billing", "rate-limiting", "microauth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.100",
    "httpx>=0.24",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.urls]
Homepage = "https://microauth.com"
Repository = "https://github.com/Zyref-Org/microauth-sdk-fastapi"

[tool.hatch.build.targets.wheel]
packages = ["microauth_fastapi"]
