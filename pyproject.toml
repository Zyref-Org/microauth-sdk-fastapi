[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microauth-fastapi"
version = "3.1.0"
description = "MicroAuth SDK for FastAPI: user sign in, access tokens for APIs and MCP servers, and API keys with metered billing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zyref, LLC" }]
keywords = [
    "fastapi",
    "authentication",
    "oauth",
    "openid-connect",
    "mcp",
    "api-keys",
    "billing",
    "rate-limiting",
    "microauth",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=44.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.10.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0.1"]
# 2.0 is the first MCP Python SDK release that speaks the 2026-07-28 protocol.
mcp = ["mcp>=2.0"]
dev = ["build", "mypy", "pip-audit", "pytest", "ruff"]

[project.urls]
Homepage = "https://microauth.com"
Documentation = "https://microauth.com/docs/fastapi"
Changelog = "https://github.com/Zyref-Org/microauth-sdk-fastapi/blob/main/CHANGELOG.md"
Repository = "https://github.com/Zyref-Org/microauth-sdk-fastapi"
Issues = "https://github.com/Zyref-Org/microauth-sdk-fastapi/issues"

[tool.hatch.build.targets.wheel]
packages = ["microauth_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"microauth_fastapi/limiter.py" = ["BLE001"]
"microauth_fastapi/sdk.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
packages = ["microauth_fastapi"]
check_untyped_defs = true
warn_unused_ignores = true

# The MCP SDK is an optional extra, imported lazily.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
